[pytest]
testpaths = genesis/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    desktop: Desktop UI test (requires textual)
    integration: Integration test (may use network)
    slow: Slow test (>5s execution time)
    ai: AI provider test (requires provider endpoints)
    auth: Authentication / authorization test
    plugin: Plugin system test
    ws: WebSocket test
    storage: Storage / persistence test
filterwarnings =
    ignore::DeprecationWarning
